[project]
name = "mcp-andalucia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan David", email = "jdayllon@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.3",
    "pyproj>=3.8.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
mcp-andalucia = "mcp_andalucia:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
