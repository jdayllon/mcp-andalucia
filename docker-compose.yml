services:
  mcp-andalucia:
    build: .
    container_name: mcp-andalucia
    ports:
      - "8000:8000"
    environment:
      MCP_ANDALUCIA_LOG_LEVEL: INFO
      MCP_ANDALUCIA_LOG_FORMAT: text
      MCP_ANDALUCIA_RESPONSE_CACHE_TTL_SECONDS: 900
      # Opcional para aumentar cuota en OpenSky:
      # MCP_ANDALUCIA_OPENSKY_CLIENT_ID: ""
      # MCP_ANDALUCIA_OPENSKY_CLIENT_SECRET: ""
    volumes:
      - mcp_andalucia_data:/data
    restart: unless-stopped

volumes:
  mcp_andalucia_data:
